name: beat
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "0 * * * *"
  workflow_dispatch:
jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: builders + watchers run (continuous work, never waits)
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT }}
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CF_VIEWS_KV: ${{ secrets.CF_VIEWS_KV }}
          GUMROAD_TOKEN: ${{ secrets.GUMROAD_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          python tools/builder.py || true
          python tools/hourly.py || true
      - name: wake the CEO
        env:
          FOREMAN_KEY: ${{ secrets.FOREMAN_KEY }}
        run: curl -sS -m 100 -A "nb-agent/1.0" "https://northbench-foreman.a7maaadesmail93.workers.dev/?key=${FOREMAN_KEY}&source=patrol&mode=patrol" | head -c 200 || true
