name: self-repair
on:
  workflow_dispatch:
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: redeploy last-known-good worker
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT }}
          CF_VIEWS_KV: ${{ secrets.CF_VIEWS_KV }}
          FOREMAN_KEY: ${{ secrets.FOREMAN_KEY }}
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
          GUMROAD_TOKEN: ${{ secrets.GUMROAD_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: python tools/deploy-worker.py
