name: nightly
on:
  schedule:
    - cron: "15 3 * * *"   # 03:15 UTC daily - after the shop's day closes
  workflow_dispatch: {}      # run on demand from the Actions tab

permissions:
  contents: write            # the run commits KPI.md back

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: run the night crew
        env:
          VAULT_KEY: ${{ secrets.VAULT_KEY }}
          GUMROAD_TOKEN: ${{ secrets.GUMROAD_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python tools/nightly.py

      - name: commit the KPI snapshot
        run: |
          git config user.name "northbench-ops"
          git config user.email "actions@users.noreply.github.com"
          git add KPI.md
          git diff --cached --quiet && echo "no changes" || git commit -m "nightly kpi $(date -u +%F)"
          git push
