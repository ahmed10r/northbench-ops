name: nightly
on:
  schedule:
    - cron: "15 3 * * *"   # 03:15 UTC daily - after the shop's day closes
  workflow_dispatch: {}      # run on demand from the Actions tab

permissions:
  contents: write            # the run commits KPI.md + site changes back

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: run the night crew
        env:
          VAULT_KEY: ${{ secrets.VAULT_KEY }}
          GUMROAD_TOKEN: ${{ secrets.GUMROAD_TOKEN }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT }}
          NB_VIEWS_KV: ${{ secrets.CF_VIEWS_KV }}
        run: python tools/nightly.py

      - name: commit the KPI snapshot
        run: |
          git config user.name "northbench-ops"
          git config user.email "actions@users.noreply.github.com"
          git add KPI.md
          git diff --cached --quiet && echo "no changes" || git commit -m "nightly kpi $(date -u +%F)"
          git push

      # v3.5 site-sync: the auto-builder. Regenerates the data-driven pages
      # (index, guides index, sitemap) from landing/site-data.json and, when
      # anything changed, redeploys the site to Cloudflare. A data edit in
      # this repo is enough - the site follows within a day, or instantly
      # on dispatch. The VIEWS KV id must ride along or analytics goes dark.
      - name: keep the site up to date (auto-builder)
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT }}
          NB_LANDING: ${{ github.workspace }}/landing
          NB_VIEWS_KV: ${{ secrets.CF_VIEWS_KV }}
        run: |
          python tools/site_builder.py
          git add landing
          if ! git diff --cached --quiet; then
            echo "site data changed - rebuilding and deploying"
            python tools/cf_site.py deploy
            git commit -m "site: auto-rebuilt from site-data.json"
            git push
          else
            echo "site already current - no deploy"
          fi
