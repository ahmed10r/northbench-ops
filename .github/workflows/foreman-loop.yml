name: the agency 24/7
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
# Serialize scheduled and watchdog-dispatched runs against shared state.
concurrency:
  group: foreman-loop-main
  cancel-in-progress: false
jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: build whatever the CEO ordered
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT }}
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CF_VIEWS_KV: ${{ secrets.CF_VIEWS_KV }}
        run: python tools/builder.py || true
      - name: hourly owner report
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT }}
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CF_VIEWS_KV: ${{ secrets.CF_VIEWS_KV }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/hourly.py || true
      - name: wake the CEO (patrol)
        env:
          FOREMAN_KEY: ${{ secrets.FOREMAN_KEY }}
        run: |
          curl -sS -m 240 -A "nb-agent/1.0" \
            "https://northbench-foreman.a7maaadesmail93.workers.dev/?key=${FOREMAN_KEY}&source=patrol&mode=patrol" \
            | head -c 300 || echo "patrol ping failed (non-fatal)"
